[project]
name = "house-price-prediction"
version = "0.1.0"
description = "Ames house price prediction notebook and recruiter demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "ipykernel>=7.4.0",
    "jinja2>=3.1.6",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pandas-stubs~=3.1.0",
    "python-docx>=1.2.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
